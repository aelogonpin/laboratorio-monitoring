# Aplicación raíz del central: lo único que se aplica a mano (kubectl apply -f central/raiz.yaml).
# Crea las Applications de central/infra/aplicaciones/ (base del clúster) y central/monitoring-laboratorio/argocd/
# (kafka, monitoring, logging, logging-operator), ordenadas por sync-wave. Argo CD va instalado a mano, estándar
# (install.yaml v3.6.1 + timeout de sync, ver GUIA-MONTAJE.md), y no se gestiona desde este repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: raiz-central
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
  - repoURL: https://github.com/aelogonpin/laboratorio-monitoring.git
    targetRevision: main
    path: central/infra/aplicaciones
  - repoURL: https://github.com/aelogonpin/laboratorio-monitoring.git
    targetRevision: main
    path: central/monitoring-laboratorio/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
