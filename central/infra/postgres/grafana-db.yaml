# PostgreSQL for Grafana: same shape as production (external PostgreSQL >= 12, DB `grafana`, user `grafana`,
# ssl_mode require). CloudNativePG serves TLS with its own CA, so `require` (encrypt, no CA check) works as in prod.
# Grafana host: grafana-db-rw.postgres.svc.cluster.local:5432 (repo/values.yaml, grafana."grafana.ini".database).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-db
  namespace: postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  bootstrap:
    initdb:
      database: grafana
      owner: grafana
      # kubernetes.io/basic-auth Secret created by infra/monitoring/secrets.sh
      secret:
        name: grafana-db-credentials
  storage:
    size: 5Gi
    storageClass: local-path
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
---
# Metrics of the instance for kube-prometheus-stack (spec.monitoring.enablePodMonitor is deprecated)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: grafana-db
  namespace: postgres
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: grafana-db
  podMetricsEndpoints:
  - port: metrics
