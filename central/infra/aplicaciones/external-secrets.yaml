# External Secrets Operator: lleva Secrets entre el clúster y Vault (PushSecret sube, ExternalSecret baja).
# En la ingesta mTLS, el central SUBE a Vault el certificado de cada cliente y el cliente lo BAJA.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
  - repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.15.0
    helm:
      releaseName: external-secrets
      valueFiles:
      - $repo/central/infra/external-secrets/values.yaml
  - repoURL: https://github.com/aelogonpin/laboratorio-monitoring.git
    targetRevision: testing
    ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry: {limit: 10, backoff: {duration: 20s, factor: 2, maxDuration: 5m}}
