# Namespaces con la etiqueta monitoring=true y los Secrets del laboratorio (en claro, repo público: solo valores de laboratorio).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/aelogonpin/laboratorio-monitoring.git
    targetRevision: main
    path: central/infra/base
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
    - ServerSideApply=true
    retry: {limit: 10, backoff: {duration: 20s, factor: 2, maxDuration: 5m}}
