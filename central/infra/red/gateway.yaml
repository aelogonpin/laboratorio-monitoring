# Plano de datos de Envoy: Service LoadBalancer con externalTrafficPolicy Local (IP real del cliente para ipPermitidas)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: principal
  namespace: envoy-gateway-system
spec:
  # Todos los Gateway de la clase envoy en el mismo Envoy y la misma IP (principal + ingesta del monitoring-stack)
  mergeGateways: true
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: principal
    namespace: envoy-gateway-system
---
# Gateway de la plataforma: HTTP para Grafana y Argo CD. La ingesta mTLS crea su propio Gateway (namespace monitoring,
# un listener 443 por cliente) que se fusiona con este por mergeGateways.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: principal
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces: {from: All}
---
# Métricas del Envoy (por ruta/backend): IngestaClienteSinDatos usa envoy_cluster_upstream_rq_xx
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
  namespace: envoy-gateway-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
  podMetricsEndpoints:
  - port: metrics
    path: /stats/prometheus
