# Traefik official chart (traefik/traefik 42.1.1) — single-node k0s, Gateway API enabled
# CRDs (Traefik + Gateway API experimental) come from the traefik-crds release.

providers:
  kubernetesCRD:
    enabled: true
    # mTLS de ingesta: las IngressRoute de `ingesta` usan Services de logging/monitoring.
    # Sin esto Traefik descarta en silencio las referencias a otro namespace (ver ../../mtls/).
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
  kubernetesGateway:
    enabled: true
    experimentalChannel: true   # TCPRoute / TLSRoute

gatewayClass:
  enabled: true
  name: traefik

gateway:
  enabled: true
  name: traefik-gateway
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All               # routes from any namespace (e.g. monitoring) may attach

ingressClass:
  enabled: true
  isDefaultClass: true

# No cloud LB on this VM: bind 80/443 directly on the node
ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443

service:
  spec:
    type: ClusterIP

# hostPort can't be held by two pods at once on one node
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

metrics:
  prometheus:
    entryPoint: metrics
    # mTLS de ingesta: peticiones por router (alerta IngestaClienteSinDatos) y Service/ServiceMonitor para el
    # Prometheus del stack (el namespace traefik lleva la etiqueta monitoring=true)
    addRoutersLabels: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true

accessLog:
  enabled: true
  format: json
