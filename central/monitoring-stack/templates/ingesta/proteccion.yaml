{{- /*
Protección de las CAs de los clientes (ingesta.proteger): los Secrets ca-<cliente> que crea cert-manager (pki.yaml,
etiqueta ingesta.ca). Si uno se borra:
  - mientras falta, la ClientTrafficPolicy de ese cliente no se aplica y Envoy deja de EXIGIR certificado en su listener;
  - cert-manager crea OTRA CA, y el certificado que tiene el cliente (firmado por la vieja) deja de valer.
Una ValidatingAdmissionPolicy (sin webhook: la evalúa el API server), solo en el namespace de la release:
  - borrarlo: solo con la anotación ingesta.borrable=true (baja: central/GUIA-CLIENTES-INGESTA.md)
  - crearlo o cambiarlo: tls.crt tiene que EMPEZAR por un certificado PEM. En CEL, data llega en base64 y no hay
    base64.decode: se compara con el base64 de "-----BEGIN CERTIFICATE-----" (27 bytes = 36 caracteres exactos)
  - cambiarlo: no se le puede quitar ni cambiar la etiqueta ingesta.ca (sería sacarlo de la protección)
cert-manager no borra los Secrets al borrar el Certificate, así que la protección no estorba a sus renovaciones.
*/ -}}
{{- if include "ms.globalFlag" (dict "root" $ "path" "monitoring.ingesta") }}
{{- if and .Values.ingesta.proteger (include "ms.ingesta.clientes" $ | fromJsonArray) }}
{{- $nombre := printf "%s-ingesta-cas-clientes" .Release.Name }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: {{ $nombre }}}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE, DELETE]
      resources: [secrets]
  validations:
  - expression: >-
      request.operation != 'DELETE' ||
      oldObject.metadata.?annotations[?'ingesta.borrable'].orValue('') == 'true'
    messageExpression: >-
      'Secret con la CA del cliente ' + oldObject.metadata.labels['ingesta.ca'] + ' de la ingesta mTLS: sin él,
      Envoy deja de exigir certificado en su listener y cert-manager crea otra CA. Baja: primero el values (push, sync) y luego anotar ingesta.borrable=true y borrar. Ver GUIA-CLIENTES-INGESTA.md'
    reason: Forbidden
  - expression: >-
      request.operation == 'DELETE' ||
      object.?data[?'tls.crt'].orValue('').startsWith('LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t')
    message: "La CA de un cliente de la ingesta necesita un tls.crt que empiece por -----BEGIN CERTIFICATE-----"
    reason: Invalid
  - expression: >-
      request.operation != 'UPDATE' || !oldObject.metadata.?labels[?'ingesta.ca'].hasValue() ||
      object.metadata.?labels[?'ingesta.ca'].orValue('') == oldObject.metadata.labels['ingesta.ca']
    message: "No se puede quitar ni cambiar la etiqueta ingesta.ca de la CA de un cliente"
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: {{ $nombre }}}
spec:
  policyName: {{ $nombre }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions: [{key: kubernetes.io/metadata.name, operator: In, values: [{{ .Release.Namespace }}]}]
    objectSelector:
      matchExpressions: [{key: ingesta.ca, operator: Exists}]
{{- end }}
{{- end }}
