{{- /* Ingesta mTLS de clientes externos (global.monitoring.ingesta). Valores: .Values.ingesta; clientes: ingesta.clientes. */ -}}
{{- if include "ms.globalFlag" (dict "root" $ "path" "monitoring.ingesta") }}
# CA en el central: por cada cliente, su CA y su certificado de cliente (la clave se genera aquí y se entrega con
# entrega.pushSecret o a mano). Emisor autofirmado: crea la CA de cada cliente (y la de servidor de laboratorio)
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: ingesta-autofirmado, namespace: {{ .Release.Namespace }}}
spec: {selfSigned: {}}
{{- if .Values.ingesta.servidorTLS.crear }}
{{- $issuer := .Values.ingesta.servidorTLS.issuerRef }}
{{- if not $issuer.name }}
---
# CA de servidor de LABORATORIO (en producción se usa issuerRef o el certificado del dominio)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ingesta-ca-servidor
  namespace: {{ .Release.Namespace }}
  annotations: {helm.sh/resource-policy: keep}
spec:
  isCA: true
  secretName: ingesta-ca-servidor
  commonName: ingesta-ca-servidor
  duration: {{ .Values.ingesta.certCliente.caDuracion }}
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: ingesta-autofirmado}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: ingesta-ca-servidor, namespace: {{ .Release.Namespace }}}
spec: {ca: {secretName: ingesta-ca-servidor}}
{{- $issuer = dict "name" "ingesta-ca-servidor" "kind" "Issuer" }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: ingesta-servidor, namespace: {{ .Release.Namespace }}}
spec:
  secretName: {{ .Values.ingesta.servidorTLS.secretName }}
  dnsNames: ["*.{{ .Values.ingesta.dominio }}"]
  issuerRef: {name: {{ $issuer.name }}, kind: {{ $issuer.kind | default "Issuer" }}}
{{- end }}
{{- range (include "ms.ingesta.clientes" $ | fromJsonArray) }}
{{- $cert := merge (deepCopy (.certificado | default dict)) $.Values.ingesta.certCliente }}
---
# CA propia de {{ .nombre }}: solo firma su certificado, y su listener solo confía en ella. La etiqueta ingesta.ca
# pone su Secret bajo la protección de proteccion.yaml: si se borra, cert-manager crearía OTRA CA y el certificado
# que tiene el cliente dejaría de valer (y mientras falta, el listener no exige certificado).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ca-{{ .nombre }}
  namespace: {{ $.Release.Namespace }}
  annotations: {helm.sh/resource-policy: keep}
  labels: {ingesta.cliente: {{ .nombre }}}
spec:
  isCA: true
  secretName: ca-{{ .nombre }}
  secretTemplate:
    labels: {ingesta.ca: {{ .nombre }}}
  commonName: ingesta-ca-{{ .nombre }}
  duration: {{ $.Values.ingesta.certCliente.caDuracion }}
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Never}
  issuerRef: {name: ingesta-autofirmado}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: ca-{{ .nombre }}, namespace: {{ $.Release.Namespace }}}
spec: {ca: {secretName: ca-{{ .nombre }}}}
---
# Certificado de cliente de {{ .nombre }}: cert-manager lo renueva solo (renewBefore) y la entrega (PushSecret a
# Vault, o a mano en el laboratorio) lo lleva al cliente. RSA: el plugin Loki de Fluentd no acepta ECDSA.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cliente-{{ .nombre }}
  namespace: {{ $.Release.Namespace }}
  labels: {ingesta.cliente: {{ .nombre }}}
spec:
  secretName: cliente-{{ .nombre }}
  secretTemplate:
    labels: {ingesta.cliente: {{ .nombre }}}
  commonName: {{ .nombre }}
  usages: [client auth, digital signature]
  duration: {{ $cert.duracion }}
  renewBefore: {{ $cert.renovarAntes }}
  privateKey: {algorithm: {{ $cert.algoritmo }}, size: {{ $cert.tamano }}, rotationPolicy: Always}
  issuerRef: {name: ca-{{ .nombre }}}
{{- end }}

{{- end }}
