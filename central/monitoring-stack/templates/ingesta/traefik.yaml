{{- /* Ingesta mTLS de clientes externos (global.monitoring.ingesta). Valores: .Values.ingesta; clientes: ingesta.clientes. */ -}}
{{- if include "ms.globalFlag" (dict "root" $ "path" "monitoring.ingesta") }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: ingesta-limite-cuerpo, namespace: {{ .Release.Namespace }}}
spec:
  buffering:
    maxRequestBodyBytes: {{ int .Values.ingesta.limiteCuerpo }}
---
# Prometheus escribe en /api/v1/push; cortex-tenant escucha en /push
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: ingesta-a-cortex-tenant, namespace: {{ .Release.Namespace }}}
spec:
  replacePath: {path: /push}
{{- range (include "ms.ingesta.clientes" $ | fromJsonArray) }}
{{- $c := . }}
---
# Solo certificados firmados por la CA de {{ .nombre }}. sniStrict: sin SNI no hay conexión.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata: {name: mtls-{{ .nombre }}, namespace: {{ $.Release.Namespace }}}
spec:
  minVersion: VersionTLS12
  sniStrict: true
  clientAuth:
    {{- if .cas }}
    # una o varias CAs del cliente (varias = cambio de CA sin corte)
    secretNames: [{{ range $i, $_ := .cas }}{{ if $i }}, {{ end }}ca-{{ $c.nombre }}-{{ $i }}{{ end }}]
    {{- else }}
    secretNames: [ca-{{ .nombre }}]
    {{- end }}
    clientAuthType: RequireAndVerifyClientCert
{{- if .ipPermitidas }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: ip-{{ .nombre }}, namespace: {{ $.Release.Namespace }}}
spec:
  ipAllowList:
    sourceRange: {{ toJson .ipPermitidas }}
{{- end }}
---
# El tenant lo pone el servidor: sobrescribe cualquier X-Scope-OrgID que mande el cliente
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: tenant-{{ .nombre }}, namespace: {{ $.Release.Namespace }}}
spec:
  headers:
    customRequestHeaders:
      X-Scope-OrgID: {{ include "ms.ingesta.tenant" . | quote }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingesta-{{ .nombre }}
  namespace: {{ $.Release.Namespace }}
  labels: {ingesta.cliente: {{ .nombre }}}
spec:
  entryPoints: {{ toJson $.Values.ingesta.entryPoints }}
  routes:
  {{- $host := include "ms.ingesta.host" (dict "c" $c "root" $) }}
  {{- $mw := list (dict "name" "ingesta-limite-cuerpo") (dict "name" (printf "tenant-%s" .nombre)) }}
  {{- $mwGrpc := list (dict "name" (printf "tenant-%s" .nombre)) }}
  {{- if .ipPermitidas }}
  {{- $mw = prepend $mw (dict "name" (printf "ip-%s" .nombre)) }}
  {{- $mwGrpc = prepend $mwGrpc (dict "name" (printf "ip-%s" .nombre)) }}
  {{- end }}
  {{- if include "ms.ingesta.senal" (dict "c" $c "senal" "logs" "root" $) }}
  - kind: Rule
    match: Host(`{{ $host }}`) && (Path(`/loki/api/v1/push`) || Path(`/otlp/v1/logs`))
    middlewares: {{ toJson $mw }}
    services: [{name: {{ $.Values.ingesta.backends.loki.service }}, namespace: {{ $.Values.ingesta.backends.loki.namespace }}, port: {{ $.Values.ingesta.backends.loki.port }}}]
  {{- end }}
  {{- if include "ms.ingesta.senal" (dict "c" $c "senal" "metricas" "root" $) }}
  {{- if .metricasPorCortexTenant }}
  # remote_write -> cortex-tenant: tenant = {{ include "ms.ingesta.tenant" . }}-<label>
  - kind: Rule
    match: Host(`{{ $host }}`) && Path(`/api/v1/push`)
    middlewares: {{ toJson (append $mw (dict "name" "ingesta-a-cortex-tenant")) }}
    services: [{name: {{ $.Values.ingesta.cortexTenant.service }}, namespace: {{ $.Values.ingesta.cortexTenant.namespace }}, port: {{ $.Values.ingesta.cortexTenant.port }}}]
  - kind: Rule
    match: Host(`{{ $host }}`) && Path(`/otlp/v1/metrics`)
  {{- else }}
  - kind: Rule
    match: Host(`{{ $host }}`) && (Path(`/api/v1/push`) || Path(`/otlp/v1/metrics`))
  {{- end }}
    middlewares: {{ toJson $mw }}
    services: [{name: {{ $.Values.ingesta.backends.mimir.service }}, namespace: {{ $.Values.ingesta.backends.mimir.namespace }}, port: {{ $.Values.ingesta.backends.mimir.port }}}]
  {{- end }}
  tls:
    secretName: {{ $.Values.ingesta.servidorTLS.secretName }}
    options: {name: mtls-{{ .nombre }}}
{{- end }}

{{- end }}
