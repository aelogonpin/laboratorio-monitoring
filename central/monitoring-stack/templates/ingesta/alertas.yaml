{{- /* Ingesta mTLS de clientes externos (global.monitoring.ingesta). Valores: .Values.ingesta; clientes: ingesta.clientes. */ -}}
{{- if include "ms.globalFlag" (dict "root" $ "path" "monitoring.ingesta") }}
{{- if .Values.ingesta.alertas.enabled }}
{{- if .Values.ingesta.alertas.serviceMonitorCertManager.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: cert-manager, namespace: {{ .Release.Namespace }}}
spec:
  namespaceSelector: {matchNames: [{{ .Values.ingesta.alertas.serviceMonitorCertManager.namespace }}]}
  selector: {matchLabels: {{ toJson .Values.ingesta.alertas.serviceMonitorCertManager.selector }}}
  # honorLabels: si no, el namespace del certificado pasa a exported_namespace y las alertas no casan
  endpoints: [{port: http-metrics, interval: 60s, honorLabels: true}]
---
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: {name: ingesta-mtls, namespace: {{ .Release.Namespace }}}
spec:
  groups:
  - name: ingesta-mtls
    rules:
    # cert-manager renueva cada certificado de cliente a falta de renovarAntes (renewal_timestamp). Relativas a cada
    # certificado (valen igual con 90 días que con 1 h): avisan si ha pasado su hora de renovar y no lo ha hecho.
    - alert: IngestaCertificadoClienteSinRenovar
      expr: time() - certmanager_certificate_renewal_timestamp_seconds{namespace="{{ .Release.Namespace }}", name=~"cliente-.*"} > 900
      for: 15m
      labels: {severity: warning}
      annotations:
        summary: "Certificado de ingesta {{`{{ $labels.name }}`}}: cert-manager no lo ha renovado a su hora"
        description: "kubectl -n {{ .Release.Namespace }} describe certificate {{`{{ $labels.name }}`}} (y sus CertificateRequest). El cliente sigue con el actual hasta que caduque."
    # Ha pasado la mitad del margen de renovación sin renovar: queda poco para que el cliente deje de enviar
    - alert: IngestaCertificadoClienteCaducaPronto
      expr: |
        time() > certmanager_certificate_renewal_timestamp_seconds{namespace="{{ .Release.Namespace }}", name=~"cliente-.*"}
          + (certmanager_certificate_expiration_timestamp_seconds{namespace="{{ .Release.Namespace }}", name=~"cliente-.*"}
             - certmanager_certificate_renewal_timestamp_seconds{namespace="{{ .Release.Namespace }}", name=~"cliente-.*"}) / 2
      labels: {severity: critical}
      annotations:
        summary: "Certificado de ingesta {{`{{ $labels.name }}`}} sin renovar y con más de la mitad del margen gastado: el cliente dejará de enviar al caducar"
{{- if .Values.ingesta.alertas.sinDatos.enabled }}
{{- range (include "ms.ingesta.clientes" $ | fromJsonArray) }}
{{- $r := printf "httproute/%s/ingesta-%s/rule/.*" $.Release.Namespace .nombre }}
    # Sin respuestas 2xx de los backends para {{ .nombre }} (métricas del Envoy). Si su certificado se rechaza, la
    # petición ni llega a la ruta, así que también salta.
    - alert: IngestaClienteSinDatos
      expr: |
        sum(increase(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~"{{ $r }}", envoy_response_code_class="2"}[{{ $.Values.ingesta.alertas.sinDatos.minutos }}m])) < 1
        or absent(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~"{{ $r }}", envoy_response_code_class="2"})
      for: 5m
      labels: {severity: warning, cliente: {{ .nombre }}}
      annotations:
        summary: "{{ .nombre }} lleva {{ $.Values.ingesta.alertas.sinDatos.minutos }} min sin enviar datos por la ingesta mTLS"
        description: "Revisar con el agente diagnostico-ingesta-mtls: certificado (cert-manager del cliente), red o agentes."
{{- end }}
{{- end }}
{{- range (include "ms.ingesta.clientes" $ | fromJsonArray) }}
{{- $m := printf "ingesta_clienttrafficpolicy_condicion{namespace=\"%s\", name=\"ingesta-%s\", type=\"Accepted\"}" $.Release.Namespace .nombre }}
    # Sin la ClientTrafficPolicy aplicada, Envoy NO exige certificado en el listener de {{ .nombre }}.
    # Métrica de kube-state-metrics (customResourceState, values prometheus.kube-state-metrics).
    - alert: IngestaPoliticaClienteNoAplicada
      expr: ({{ $m }} == 0) or absent({{ $m }})
      for: 2m
      labels: {severity: critical, cliente: {{ .nombre }}}
      annotations:
        summary: "{{ .nombre }}: su ClientTrafficPolicy no está aplicada; su listener de la ingesta NO exige certificado"
        description: "kubectl -n {{ $.Release.Namespace }} get clienttrafficpolicy ingesta-{{ .nombre }} -o yaml (status). Lo normal: falta su Secret de CA o su ca.crt no vale."
    - alert: IngestaCAClienteFalta
      expr: absent(kube_secret_info{namespace="{{ $.Release.Namespace }}", secret="ca-{{ .nombre }}"})
      for: 2m
      labels: {severity: critical, cliente: {{ .nombre }}}
      annotations:
        summary: "Falta el Secret {{ $.Release.Namespace }}/ca-{{ .nombre }} con la CA de {{ .nombre }}: su listener NO exige certificado"
        description: "cert-manager creará otra CA: el certificado del cliente deja de valer hasta que reciba uno nuevo (se renueva y entrega solo en minutos; GUIA-CLIENTES-INGESTA.md)."
{{- if $.Values.ingesta.entrega.pushSecret.enabled }}
{{- $m := printf "ingesta_pushsecret_condicion{namespace=\"%s\", name=\"ingesta-%s\", type=\"Ready\"}" $.Release.Namespace .nombre }}
    # El certificado de {{ .nombre }} no llega a Vault: cuando cert-manager lo renueve, el cliente no lo recibirá.
    - alert: IngestaEntregaClienteFalla
      expr: ({{ $m }} == 0) or absent({{ $m }})
      for: 15m
      labels: {severity: warning, cliente: {{ .nombre }}}
      annotations:
        summary: "{{ .nombre }}: el PushSecret de su certificado no consigue subirlo al almacén (Vault)"
        description: "kubectl -n {{ $.Release.Namespace }} describe pushsecret ingesta-{{ .nombre }}. Revisar el ClusterSecretStore y la política de Vault."
{{- end }}
{{- end }}
    - alert: IngestaCertificadoNoListo
      expr: certmanager_certificate_ready_status{namespace="{{ .Release.Namespace }}", condition!="True"} == 1
      for: 15m
      labels: {severity: warning}
      annotations:
        summary: "cert-manager no tiene listo {{`{{ $labels.name }}`}} en {{ .Release.Namespace }}"
{{- end }}

{{- end }}
