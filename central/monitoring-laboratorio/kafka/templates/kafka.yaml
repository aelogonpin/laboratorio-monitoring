# Kafka del laboratorio: un nodo (broker + controller), topic mimir-ingest con 1 partición (1 ingester).
# Los CRDs llegan con el subchart strimzi; estos CR van en una sync-wave posterior.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  kafka:
    version: 4.3.1
    listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
    config:
      auto.create.topics.enable: false
      default.replication.factor: 1
      log.retention.hours: 24
      message.max.bytes: 16000000
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      replica.fetch.max.bytes: 16000000
      transaction.state.log.min.isr: 1
      transaction.state.log.replication.factor: 1
  entityOperator:
    topicOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  namespace: monitoring
  labels:
    strimzi.io/cluster: kafka
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: 1
  roles:
  - controller
  - broker
  storage:
    type: jbod
    volumes:
    - id: 0
      type: persistent-claim
      size: 10Gi
      class: local-path
      deleteClaim: false
      kraftMetadata: shared
  resources:
    limits:
      memory: 1536Mi
    requests:
      cpu: 200m
      memory: 1Gi
  jvmOptions:
    -Xms: 512m
    -Xmx: 768m
  template:
    pod:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  strimzi.io/cluster: kafka
                  strimzi.io/pool-name: dual
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: mimir-ingest
  namespace: monitoring
  labels:
    strimzi.io/cluster: kafka
  annotations:
    argocd.argoproj.io/sync-wave: '2'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  topicName: mimir-ingest
  partitions: 1
  replicas: 1
  config:
    max.message.bytes: 16000000
    min.insync.replicas: 1
    retention.ms: 86400000
