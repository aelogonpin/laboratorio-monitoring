# Values del LABORATORIO (k0s-central) para el chart monitoring-stack 3.x. Se aplica encima del values del chart en
# las Applications monitoring y logging (argocd/). Todo lo que hay aquí es propio de este entorno o de pruebas.
global:
  defaultStorageClass: local-path
  storageClass: local-path
  objectStorage:
    s3Endpoint: seaweedfs-all-in-one.seaweedfs.svc.cluster.local:8333
  # Kafka del laboratorio: Application kafka (kafka/)
  kafka:
    bootstrap: kafka-kafka-bootstrap.monitoring.svc.cluster.local:9092
  hosts:
    esquema: http
    monitoring: monitoring.10.99.90.58.nip.io
  parameters:
    clusterName: k0s-central
    # el tenant de cada cliente (central/GUIA-CLIENTES-INGESTA.md)
    grafanaClusters: k0s-central|cliente-demo|cliente-b
grafana:
  route:
    main:
      parentRefs:
        - name: principal
          namespace: envoy-gateway-system
  persistence:
    storageClassName: local-path
  grafana.ini:
    database:
      host: grafana-db-rw.postgres.svc.cluster.local:5432
mimir:
  mimir:
    structuredConfig:
      common:
        storage:
          s3:
            insecure: true
            bucket_lookup_type: path
  compactor:
    persistentVolume:
      storageClass: local-path
  ingester:
    persistentVolume:
      storageClass: local-path
  store_gateway:
    persistentVolume:
      storageClass: local-path
  metaMonitoring:
    serviceMonitor:
      clusterLabel: k0s-central
prometheus:
  prometheus:
    prometheusSpec:
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
      remoteWrite:
        - url: http://mimir-gateway.monitoring.svc/api/v1/push
          headers:
            X-Scope-OrgID: k0s-central
loki:
  loki:
    storage:
      s3:
        endpoint: seaweedfs-all-in-one.seaweedfs.svc.cluster.local:8333
        region: us-east-1
        s3ForcePathStyle: true
        insecure: true
  backend:
    persistence:
      storageClass: local-path
  read:
    persistence:
      storageClass: local-path
  write:
    persistence:
      storageClass: local-path
ingesta:
  dominio: ingest.10.99.90.58.nip.io
  # CA de servidor propia del laboratorio: se sube a Vault (ingesta/servidor) y los clientes la bajan
  servidorTLS:
    crear: true
  # El central crea la CA y el certificado de cada cliente y los sube a Vault (Vault del laboratorio: infra/vault/);
  # cada cliente los baja con su ExternalSecret.
  entrega:
    pushSecret:
      enabled: true
      # Laboratorio: 5 min como tope para ver las renovaciones (una renovación normal llega en segundos; un Secret
      # borrado y recreado, en la siguiente vuelta o anotando el PushSecret con force-sync=<fecha>)
      refreshInterval: 5m
  # Clientes de la ingesta mTLS. Alta, entrega y baja: central/GUIA-CLIENTES-INGESTA.md
  clientes:
    # Alta 2026-11-19. k0s-cliente (10.99.90.218). Laboratorio: certificado de 1 h renovado a falta de 40 min (cada
    # ~20 min) para ver la cadena de renovación entera; en producción, los 90 días del chart.
    - nombre: cliente-demo
      ipPermitidas: [10.99.90.218/32]
      certificado: {duracion: 1h, renovarAntes: 40m}
    # Alta 2026-11-19. k0s-cliente-b (10.99.90.254). Certificado con la duración del chart (90 días, renueva a 30).
    - nombre: cliente-b
      ipPermitidas: [10.99.90.254/32]
