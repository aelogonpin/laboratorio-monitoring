# Datos del clúster para Prometheus (externalLabels) y Fluentd (host de la ingesta = CLUSTER_NAME).
# No lleva contraseñas: el envío va por mTLS.
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-secrets
  namespace: monitoring
stringData:
  clusterName: cliente-demo
  distro: k0s
---
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-secrets
  namespace: logging
stringData:
  clusterName: cliente-demo
  distro: k0s
