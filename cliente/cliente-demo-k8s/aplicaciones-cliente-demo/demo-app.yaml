# Aplicación de ejemplo del cliente: genera logs que acaban en el Loki del central.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/aelogonpin/laboratorio-monitoring.git
    targetRevision: main
    path: cliente/cliente-demo-k8s/demo-app
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app
  syncPolicy:
    syncOptions: [CreateNamespace=true]
    automated: {prune: true, selfHeal: true}
