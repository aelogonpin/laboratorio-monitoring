# Secret monitoring-secrets del cliente (monitoring y logging). Los namespaces los crean las apps monitoring y
# logging-operator: si aún no existen, reintenta.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secretos
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/aelogonpin/laboratorio-monitoring.git
    targetRevision: main
    path: cliente/cliente-demo-k8s/secretos
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry: {limit: 10, backoff: {duration: 20s, factor: 2, maxDuration: 5m}}
