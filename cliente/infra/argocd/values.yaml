# Argo CD del cliente (chart oficial argo/argo-cd 10.10.5 = Argo CD v3.5.5). Lee cliente/ de este repo público,
# sin credenciales. Sin ruta: el cliente no expone nada; se entra con
#   kubectl -n argocd port-forward svc/argocd-server 8080:80
# Sin SSO: admin local (argocd-initial-admin-secret).
configs:
  params:
    server.insecure: true
    controller.diff.server.side: "true"
  cm:
    timeout.reconciliation: 60s
  repositories:
    laboratorio-monitoring:
      name: laboratorio-monitoring
      type: git
      url: https://github.com/aelogonpin/laboratorio-monitoring.git

dex:
  enabled: false
notifications:
  enabled: false

controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 1Gi}
server:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
applicationSet:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 256Mi}
redis:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 256Mi}
